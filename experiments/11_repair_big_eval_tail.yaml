name: "big_eval_canon"
description: "Repair run A for big_eval_canon: refills the h=20 / EMA [5,10,20] / min_pred 0.01 block whose runs failed in the main run on file-descriptor exhaustion (EMFILE under a 256 fd soft limit; launch with ulimit raised). Fits come from the training cache, so results are identical to what the original runs would have produced. 108 runs; 101 fill holes, 7 duplicate surviving cells (deduped post-run). ARIMA h=1 LU failures are not repaired here: deterministic, documented exclusion."

base:
  training_start: "2011-01-01"
  training_end: "2019-12-31"
  test_start: "2020-01-01"
  test_end: "2023-12-31"
  headline_only: true
  stock_ids: ["MS", "COST", "DE", "NVDA", "TMO", "VLO", "TJX", "MRK", "COP"]
  top_k: 4
  sequence_length: 60
  retraining_cadence_days: "auto"

model_defaults:
  hidden_size: 64
  num_layers: 2
  epochs: 50
  batch_size: 64
  dropout: 0.2
  early_stopping_patience: 5

grid:
  model:
    - type: xLSTM
    - type: GRU
    - type: Mamba
    - type: Jamba
    - type: MLP
    - type: ARIMA
    - type: HoltsLES

  rebalance_horizon_days: [20]
  sentiment_ema_spans:
    - [5, 10, 20]
  min_predicted_return: [0.01]
  transaction_cost_pct: [0.0, 0.001]
  conviction_mode: ["fixed", "volatility_scaled"]

# Runs: 5 neural x 5 seeds x 4 = 100 + 2 deterministic x 1 x 4 = 8 → 108 total

seeds: [42, 69, 456, 789, 1337]
